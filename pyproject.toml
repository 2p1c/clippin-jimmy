[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slippin-jimmy"
version = "0.1.0"
description = "终端聊天与剪贴板同步"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pyperclip>=1.9.0",
    "httpx>=0.27.0",
]

[project.scripts]
jimmy = "client.main:main"
slippin-jimmy = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*", "client*"]
