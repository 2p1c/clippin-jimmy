name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code and restart relay
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude 'data/' \
            --exclude 'node_modules/' \
            --exclude '__pycache__/' \
            --exclude '*.egg-info/' \
            ./ "${USER}@${HOST}:/root/clippin-jimmy/clippin-jimmy/"
          ssh "${USER}@${HOST}" \
            "cd /root/clippin-jimmy/clippin-jimmy && .venv/bin/python -m pip install -e . && systemctl restart clippin-jimmy && systemctl is-active clippin-jimmy"
